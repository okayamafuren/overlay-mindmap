<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d89ef;stop-opacity:1" />
    </linearGradient>
    
    <!-- 그림자 필터 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 메인 원 (배경) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 마인드맵 구조 (극단적으로 단순화) -->
  <!-- 중앙 노드 (큰 원) -->
  <circle cx="256" cy="256" r="60" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(45, 137, 239, 0.3)" stroke-width="2"/>
  
  <!-- 연결선 (4방향 - 직선) -->
  <line x1="256" y1="196" x2="256" y2="100" stroke="rgba(255, 255, 255, 0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="316" x2="256" y2="412" stroke="rgba(255, 255, 255, 0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="196" y1="256" x2="100" y2="256" stroke="rgba(255, 255, 255, 0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="316" y1="256" x2="412" y2="256" stroke="rgba(255, 255, 255, 0.8)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 주변 노드들 (4개 - 작은 원) -->
  <circle cx="256" cy="100" r="32" fill="rgba(255, 255, 255, 0.95)"/>
  <circle cx="256" cy="412" r="32" fill="rgba(255, 255, 255, 0.95)"/>
  <circle cx="100" cy="256" r="32" fill="rgba(255, 255, 255, 0.95)"/>
  <circle cx="412" cy="256" r="32" fill="rgba(255, 255, 255, 0.95)"/>
  
  <!-- 중앙 노드 내부 아이콘 (간단한 브레인/아이디어 심볼) -->
  <!-- 두 개의 작은 원 (아이디어) -->
  <circle cx="240" cy="250" r="8" fill="rgba(45, 137, 239, 0.9)"/>
  <circle cx="272" cy="250" r="8" fill="rgba(45, 137, 239, 0.9)"/>
  <!-- 연결하는 선 (생각의 흐름) -->
  <path d="M 232 262 Q 256 270 280 262" stroke="rgba(45, 137, 239, 0.9)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
